name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts reads it; generate and validate never connect
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npm run build
      - name: openapi.json is in step with the routes and schemas
        run: npm run docs:openapi && git diff --exit-code src/openapi.json
      # Unit tests: no database or secrets needed
      - run: npm test
      # No database or secrets needed. The other *.check.ts scripts and npm run test:e2e need Postgres, so they stay local.
      - run: npx tsx src/utils/inviteCardGeneration.check.ts
